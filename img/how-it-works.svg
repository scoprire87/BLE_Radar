<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Helvetica, Arial, sans-serif">
  <title>How BLE Radar works</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5f6b7a"/>
    </marker>
  </defs>
  <rect width="880" height="300" rx="14" fill="#ffffff"/>
  <g font-size="14" fill="#1f2933" text-anchor="middle">
    <rect x="20" y="115" width="130" height="70" rx="10" fill="#e1f5fe" stroke="#0277bd"/>
    <text x="85" y="145" font-weight="bold">Proxy BLE</text>
    <text x="85" y="166">Shelly, ESPHome</text>

    <rect x="185" y="115" width="130" height="70" rx="10" fill="#e1f5fe" stroke="#0277bd"/>
    <text x="250" y="145" font-weight="bold">Bermuda</text>
    <text x="250" y="166">distances in metres</text>

    <rect x="350" y="20" width="350" height="260" rx="12" fill="#f5f7fa" stroke="#9aa5b1" stroke-dasharray="6 4"/>
    <text x="525" y="44" font-weight="bold" fill="#52606d">BLE Radar</text>

    <rect x="370" y="62" width="150" height="74" rx="10" fill="#fff8e1" stroke="#f9a825"/>
    <text x="445" y="90" font-weight="bold">Fingerprint</text>
    <text x="445" y="110">recorded points</text>
    <text x="445" y="127">→ room and floor</text>

    <rect x="370" y="160" width="150" height="74" rx="10" fill="#fff8e1" stroke="#f9a825"/>
    <text x="445" y="188" font-weight="bold">Trilateration</text>
    <text x="445" y="208">proxies estimated</text>
    <text x="445" y="225">from the map</text>

    <rect x="550" y="110" width="130" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="615" y="140" font-weight="bold">Fusion</text>
    <text x="615" y="160">weighted by quality</text>
    <text x="615" y="178">+ Kalman filter</text>

    <rect x="725" y="105" width="135" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="792" y="133" font-weight="bold">Sensor</text>
    <text x="792" y="153">room, floor</text>
    <text x="792" y="171">x, y coordinates</text>
    <text x="792" y="189">confidence</text>
  </g>
  <g stroke="#5f6b7a" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 150H183"/>
    <path d="M315 150H340L368 100"/>
    <path d="M340 150L368 196"/>
    <path d="M445 136V158"/>
    <path d="M520 99L548 135"/>
    <path d="M520 197L548 165"/>
    <path d="M680 150H723"/>
  </g>
</svg>
