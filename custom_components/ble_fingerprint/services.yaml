save_vertex:
  fields:
    room:
      required: true
      example: "Kitchen"
      selector:
        text:
    vertex_id:
      required: true
      example: "kitchen_1"
      selector:
        text:
    distances:
      required: true
      example: '{"sensor.phone_distance_to_kitchen": 1.2, "sensor.phone_distance_to_living_room": 4.8}'
      selector:
        object:
    x:
      example: 3.5
      selector:
        number:
          min: -100000
          max: 100000
          step: 0.01
          mode: box
    y:
      example: 1.2
      selector:
        number:
          min: -100000
          max: 100000
          step: 0.01
          mode: box
    floor:
      example: "Ground floor"
      selector:
        text:

record_vertex:
  fields:
    room:
      required: true
      example: "Kitchen"
      selector:
        text:
    vertex_id:
      required: true
      example: "kitchen_1"
      selector:
        text:
    entity_id:
      example: "sensor.phone_position"
      selector:
        entity:
          integration: ble_fingerprint
          domain: sensor
    duration:
      default: 5
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: s
          mode: box
    x:
      example: 3.5
      selector:
        number:
          min: -100000
          max: 100000
          step: 0.01
          mode: box
    y:
      example: 1.2
      selector:
        number:
          min: -100000
          max: 100000
          step: 0.01
          mode: box
    floor:
      example: "Ground floor"
      selector:
        text:

delete_vertex:
  fields:
    room:
      required: true
      example: "Kitchen"
      selector:
        text:
    vertex_id:
      required: true
      example: "kitchen_1"
      selector:
        text:

delete_room:
  fields:
    room:
      required: true
      example: "Kitchen"
      selector:
        text:

get_map:

set_proxy:
